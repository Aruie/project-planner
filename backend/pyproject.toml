[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-artifact-management-backend"
version = "0.1.0"
description = "AIDLC artifact management backend"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.38.46",
    "fastapi==0.115.12",
    "md-publisher",
    "openpyxl==3.1.5",
    "pydantic==2.11.4",
    "reportlab==4.4.3",
    "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.131.9",
    "pytest==8.3.5",
    "ruff==0.11.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
md-publisher = { git = "https://github.com/Aruie/md-publisher.git", rev = "33b89970074b71db741baebdd56d9b220645d4cd" }
